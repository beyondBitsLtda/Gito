<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Barlow, Inter, system-ui, sans-serif">
  <title>Gito - arquitetura</title>
  <rect width="960" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#213D75"/>
    </marker>
  </defs>

  <!-- estacao do dev -->
  <rect x="16" y="16" width="928" height="408" rx="18" fill="none" stroke="#B0B0B0" stroke-dasharray="6 6"/>
  <text x="36" y="44" font-size="14" font-weight="700" fill="#55504B">ESTAÇÃO DO DESENVOLVEDOR (roda como o próprio usuário)</text>

  <!-- navegador -->
  <rect x="40" y="70" width="190" height="96" rx="12" fill="#EAE5DF" stroke="#213D75" stroke-width="2"/>
  <text x="135" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Navegador</text>
  <text x="135" y="126" text-anchor="middle" font-size="13" fill="#000000">web/ (HTML, CSS, JS)</text>
  <text x="135" y="146" text-anchor="middle" font-size="12" fill="#55504B">sem framework, sem build</text>

  <!-- servidor -->
  <rect x="300" y="60" width="250" height="116" rx="12" fill="#213D75"/>
  <text x="425" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">servidor.js</text>
  <text x="425" y="116" text-anchor="middle" font-size="13" fill="#FFFFFF">http em 127.0.0.1:7027</text>
  <text x="425" y="136" text-anchor="middle" font-size="12" fill="#EAE5DF">token · Host/Origin · cerca de pastas</text>
  <text x="425" y="156" text-anchor="middle" font-size="12" fill="#EAE5DF">rotas /api/*</text>

  <line x1="230" y1="118" x2="296" y2="118" stroke="#213D75" stroke-width="2.5" marker-end="url(#seta)" marker-start="url(#seta)"/>

  <!-- modulos -->
  <g font-size="14" font-weight="700">
    <rect x="610" y="56" width="150" height="54" rx="10" fill="#FFFFFF" stroke="#0B861D" stroke-width="2"/>
    <text x="685" y="82" text-anchor="middle" fill="#000000">git.js</text>
    <text x="685" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#55504B">a única porta para o git</text>

    <rect x="610" y="126" width="150" height="54" rx="10" fill="#FFFFFF" stroke="#FF6B05" stroke-width="2"/>
    <text x="685" y="152" text-anchor="middle" fill="#000000">painel.js</text>
    <text x="685" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#55504B">gito.json · issues</text>

    <rect x="610" y="196" width="150" height="54" rx="10" fill="#FFFFFF" stroke="#2362D3" stroke-width="2"/>
    <text x="685" y="222" text-anchor="middle" fill="#000000">verificar.js</text>
    <text x="685" y="240" text-anchor="middle" font-size="11" font-weight="500" fill="#55504B">está no ar? (http/tcp)</text>

    <rect x="610" y="266" width="150" height="54" rx="10" fill="#FFFFFF" stroke="#213D75" stroke-width="2"/>
    <text x="685" y="292" text-anchor="middle" fill="#000000">gitlab.js</text>
    <text x="685" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#55504B">Merge Requests (leitura)</text>

    <rect x="300" y="230" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>
    <text x="425" y="256" text-anchor="middle" fill="#000000">config.js</text>
    <text x="425" y="276" text-anchor="middle" font-size="11" font-weight="500" fill="#55504B">%APPDATA%\gito\config.json</text>
  </g>

  <g stroke="#213D75" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M550 90 H606"/>
    <path d="M550 130 C580 130 580 153 606 153"/>
    <path d="M550 150 C585 150 585 223 606 223"/>
    <path d="M550 165 C590 165 590 293 606 293"/>
    <path d="M425 176 V226"/>
  </g>

  <!-- destinos -->
  <g font-size="13">
    <rect x="800" y="56" width="128" height="54" rx="10" fill="#EAE5DF"/>
    <text x="864" y="80" text-anchor="middle" font-weight="700" fill="#000000">git (CLI)</text>
    <text x="864" y="98" text-anchor="middle" font-size="11" fill="#55504B">repositórios</text>

    <rect x="800" y="126" width="128" height="54" rx="10" fill="#EAE5DF"/>
    <text x="864" y="150" text-anchor="middle" font-weight="700" fill="#000000">gito.json</text>
    <text x="864" y="168" text-anchor="middle" font-size="11" fill="#55504B">.gito/issues</text>

    <rect x="800" y="196" width="128" height="54" rx="10" fill="#EAE5DF"/>
    <text x="864" y="220" text-anchor="middle" font-weight="700" fill="#000000">serviços</text>
    <text x="864" y="238" text-anchor="middle" font-size="11" fill="#55504B">sites e bancos</text>

    <rect x="800" y="266" width="128" height="54" rx="10" fill="#EAE5DF"/>
    <text x="864" y="290" text-anchor="middle" font-weight="700" fill="#000000">GitLab</text>
    <text x="864" y="308" text-anchor="middle" font-size="11" fill="#55504B">API read_api</text>
  </g>
  <g stroke="#B0B0B0" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M760 83 H796"/><path d="M760 153 H796"/><path d="M760 223 H796"/><path d="M760 293 H796"/>
  </g>

  <text x="40" y="360" font-size="13" fill="#000000">Sem banco de dados: a configuração é por usuário e as issues são arquivos versionados no próprio repositório.</text>
  <text x="40" y="384" font-size="13" fill="#000000">Nenhuma senha em disco. O token do GitLab vive só na memória, e o acesso ao git usa o Git Credential Manager.</text>
</svg>
